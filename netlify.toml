[build]
  command = "npm run install:all && npm install serverless-http --prefix Server && npm run build:client"
  publish = "Client/dist"
  functions = "Client/netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  VITE_API_BASE_URL = "/api"

[functions]
  node_bundler = "nft"
  included_files = ["Server/**"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200
  force = true

[[redirects]]
  from = "/api"
  to = "/.netlify/functions/api"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
